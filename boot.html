<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseline — PMP Drill</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseline">
<meta name="description" content="PMI-mindset drill for the July 2026 PMP exam.">
<link rel="manifest" href='data:application/manifest+json,{"name":"Baseline — PMP Drill","short_name":"Baseline","start_url":"./","display":"standalone","background_color":"%2315171B","theme_color":"%2315171B","orientation":"portrait"}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2315171B'/%3E%3Crect x='24' y='86' width='132' height='8' rx='4' fill='%23FFB020'/%3E%3Crect x='24' y='52' width='84' height='8' rx='4' fill='%23333A44'/%3E%3Crect x='24' y='120' width='104' height='8' rx='4' fill='%23333A44'/%3E%3C/svg%3E">
<style>
html,body{margin:0;height:100%;background:#15171B;color:#EDEFF2;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
#boot{position:fixed;inset:0;display:grid;place-content:center;gap:14px;text-align:center;padding:24px}
#boot h1{font-size:15px;letter-spacing:.16em;text-transform:uppercase;margin:0;font-weight:700}
#boot p{font-size:13px;color:#8B93A0;margin:0}
#bar{width:180px;height:3px;background:#252A32;border-radius:2px;overflow:hidden;margin:0 auto}
#bar i{display:block;height:100%;width:0;background:#FFB020;transition:width .2s}
</style>
</head>
<body>
<div id="app"></div>
<div id="boot"><h1>Baseline</h1><div id="bar"><i></i></div><p id="msg">Loading questions…</p></div>
<script>
(function(){
var B="https://cdn.jsdelivr.net/gh/cashinn777-wq/Baseline-pmp@main/";
var FILES=["d0","d1","d2","d3","d4","d5","d6","d7","d8","d9","d10","d11","e1","e2","e3"];
var bar=document.querySelector("#bar i"), msg=document.getElementById("msg");
function fail(){msg.textContent="Could not load. Check your connection and reload.";}
function step(n){bar.style.width=Math.round(n/(FILES.length+1)*100)+"%";}
fetch(B+"index.html").then(function(r){return r.text()}).then(function(html){
  var a=html.indexOf("<style>"), b=html.indexOf("</style>");
  if(a<0||b<0)throw new Error("no stylesheet");
  var st=document.createElement("style"); st.textContent=html.slice(a+7,b); document.head.appendChild(st);
  step(1);
  var i=0;
  (function next(){
    if(i>=FILES.length){var el=document.getElementById("boot"); if(el)el.remove(); return}
    var s=document.createElement("script");
    s.src=B+FILES[i]+".js";
    s.onload=function(){i++;step(i+1);next()};
    s.onerror=fail;
    document.head.appendChild(s);
  })();
}).catch(fail);
})();
</script>
</body>
</html>
