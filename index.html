<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Baseline — PMP Drill</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15171B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Baseline">
<meta name="description" content="PMI-mindset drill for the July 2026 PMP exam.">
<link rel="manifest" href='data:application/manifest+json,{"name":"Baseline — PMP Drill","short_name":"Baseline","start_url":"./","display":"standalone","background_color":"%2315171B","theme_color":"%2315171B","orientation":"portrait"}'>
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' fill='%2315171B'/%3E%3Crect x='24' y='86' width='132' height='8' rx='4' fill='%23FFB020'/%3E%3Crect x='24' y='52' width='84' height='8' rx='4' fill='%23333A44'/%3E%3Crect x='24' y='120' width='104' height='8' rx='4' fill='%23333A44'/%3E%3C/svg%3E">
<style>:root{
--ground:#15171B; --panel:#1D2127; --panel2:#252A32; --rule:#333A44; --rule2:#414A57;
--chalk:#EDEFF2; --muted:#8B93A0; --dim:#666E7A;
--amber:#FFB020; --go:#34C77B; --stop:#FF5F5F;
--surround:#0B0C0E;
--display:"Bahnschrift","Avenir Next Condensed","Roboto Condensed","Helvetica Neue Condensed",
"Arial Narrow",-apple-system,system-ui,sans-serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
--mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,monospace;
--tap:52px; --r:8px;
--safeT:env(safe-area-inset-top,0px); --safeB:env(safe-area-inset-bottom,0px);
}
html[data-theme="light"]{
--ground:#F2F3F5; --panel:#FFFFFF; --panel2:#E9EBEF; --rule:#D5D9DF; --rule2:#BFC6CF;
--chalk:#14171B; --muted:#5C6570; --dim:#7A828C;
--amber:#B26A00; --go:#0F8A52; --stop:#C62828; --surround:#D8DBE0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{
background:var(--ground);color:var(--chalk);font-family:var(--sans);
font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#app{height:100dvh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.view{display:none;flex-direction:column;height:100%;min-height:0}
.view.on{display:flex}
.scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 28px}
.bar{
flex:none;display:flex;align-items:center;gap:10px;
padding:calc(var(--safeT) + 12px) 14px 12px;
border-bottom:1px solid var(--rule);background:var(--panel)
}
.bar h6{
flex:1;margin:0;font-family:var(--display);font-size:15px;font-weight:700;
letter-spacing:.16em;text-transform:uppercase;color:var(--chalk)
}
.bar h6 small{display:block;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;color:var(--dim);font-weight:600;margin-top:2px}
.bar .center{text-align:center}
.iconbtn{
flex:none;width:42px;height:42px;display:grid;place-items:center;border-radius:var(--r);
color:var(--muted);border:1px solid transparent
}
.iconbtn:active{background:var(--panel2);color:var(--chalk)}
.iconbtn svg{width:21px;height:21px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
h1{
font-family:var(--display);font-size:34px;line-height:1.02;font-weight:700;
letter-spacing:.01em;text-transform:uppercase;margin:0 0 6px
}
h2{
font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.11em;
text-transform:uppercase;margin:26px 0 10px;color:var(--chalk)
}
.sub{color:var(--muted);font-size:15px;line-height:1.5;margin:0 0 18px}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);font-weight:700}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600}
.note{font-size:13.5px;color:var(--muted);line-height:1.55}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:16px;margin-bottom:10px}
.card.tight{padding:13px 15px}
.card.warn{border-color:color-mix(in srgb,var(--stop) 55%,var(--rule));background:color-mix(in srgb,var(--stop) 8%,var(--panel))}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.divider{height:1px;background:var(--rule);margin:22px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.stat{background:var(--panel);padding:13px 8px;text-align:center}
.stat b{display:block;font-family:var(--display);font-size:30px;font-weight:700;line-height:1;letter-spacing:.01em}
.stat span{display:block;font-family:var(--mono);font-size:9px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:6px}
.strip{display:flex;gap:4px;margin-top:12px}
.strip i{flex:1;height:26px;border-radius:3px;background:var(--panel2);border:1px solid var(--rule)}
.strip i.s-did{background:var(--go);border-color:var(--go)}
.strip i.s-today{box-shadow:inset 0 0 0 2px var(--amber)}
.btn{
display:flex;align-items:center;justify-content:center;gap:8px;width:100%;
min-height:var(--tap);padding:14px 16px;border-radius:var(--r);
font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
transition:transform .08s ease,background .14s
}
.btn:active{transform:scale(.99)}
.btn.primary{background:var(--amber);color:#191307}
.btn.ghost{background:var(--panel);border:1px solid var(--rule2);color:var(--chalk)}
.btn.quiet{background:transparent;border:1px solid var(--rule);color:var(--muted);min-height:46px;font-size:14px}
.btn.go{background:var(--go);color:#04160D}
.btn[disabled]{opacity:.3;pointer-events:none}
.plan{flex:none;padding:12px 18px 0;background:var(--panel);border-bottom:1px solid var(--rule)}
.plan-bar{display:flex;gap:2px;height:9px}
.plan-bar i,.strip i,.meter i{padding:0;margin:0;font-style:normal;border-radius:2px}
.plan-bar i{flex:1;background:var(--panel2);border-radius:1px;transition:background .3s}
.plan-bar i.s-ok{background:var(--go)}
.plan-bar i.s-bad{background:var(--stop)}
.plan-bar i.s-now{background:var(--amber)}
.plan-meta{display:flex;justify-content:space-between;padding:7px 0 11px}
.plan-meta span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);font-weight:700}
.qwrap{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 18px 4px}
.qtags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.tag{
font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;font-weight:700;
padding:5px 8px;border-radius:3px;background:var(--panel2);color:var(--muted);border:1px solid var(--rule)
}
.tag.mode{color:var(--amber);border-color:color-mix(in srgb,var(--amber) 45%,var(--rule));background:color-mix(in srgb,var(--amber) 10%,transparent)}
.scenario{font-size:18px;line-height:1.5;margin:0 0 16px;color:var(--chalk)}
.ask{
font-family:var(--sans);font-size:18px;font-weight:700;letter-spacing:-.01em;
margin:0 0 16px;padding-left:12px;border-left:3px solid var(--amber);line-height:1.38;color:var(--chalk)
}
.opts{display:flex;flex-direction:column;gap:8px;padding-bottom:6px}
.opt{
display:flex;align-items:stretch;gap:0;width:100%;text-align:left;overflow:hidden;
background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
min-height:var(--tap);transition:border-color .13s,background .13s,opacity .18s
}
.opt .key{
flex:none;width:42px;display:grid;place-items:center;background:var(--panel2);
border-right:1px solid var(--rule);
font-family:var(--display);font-size:17px;font-weight:700;letter-spacing:.05em;color:var(--muted)
}
.opt .txt{flex:1;padding:13px 13px;font-size:15.5px;line-height:1.42}
.opt .xkill{flex:none;width:40px;display:grid;place-items:center;color:var(--dim);
border-left:1px solid var(--rule);font-size:15px}
.opt.sel{border-color:var(--amber)}
.opt.sel .key{background:var(--amber);color:#191307;border-right-color:var(--amber)}
.opt.dead{opacity:.28}
.opt.dead .txt{text-decoration:line-through}
.opt.right{border-color:var(--go)}
.opt.right .key{background:var(--go);color:#04160D;border-right-color:var(--go)}
.opt.wrong{border-color:var(--stop)}
.opt.wrong .key{background:var(--stop);color:#fff;border-right-color:var(--stop)}
.why{margin:6px 0 2px;padding:12px 14px;border-radius:var(--r);background:var(--panel2);
border-left:3px solid var(--rule2);font-size:14.5px;line-height:1.5;color:var(--chalk)}
.why b{font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;display:block;margin-bottom:5px}
.why.good{border-left-color:var(--go)} .why.good b{color:var(--go)}
.why.bad{border-left-color:var(--stop)} .why.bad b{color:var(--stop)}
.rulebox{background:color-mix(in srgb,var(--amber) 10%,var(--panel));
border:1px solid color-mix(in srgb,var(--amber) 40%,var(--rule));
border-radius:var(--r);padding:14px 15px;margin:18px 0 4px}
.rulebox .eyebrow{color:var(--amber);display:block;margin-bottom:6px}
.rulebox p{margin:0;font-size:15.5px;line-height:1.5}
.dock{flex:none;padding:11px 18px calc(11px + var(--safeB));background:var(--panel);
border-top:1px solid var(--rule);display:flex;flex-direction:column;gap:8px}
.dock .pair{display:flex;gap:8px}
.dock .pair .btn{flex:1;font-size:15px;letter-spacing:.07em}
.hint{text-align:center;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
text-transform:uppercase;color:var(--dim);margin:0;font-weight:700}
nav{flex:none;display:flex;background:var(--panel);border-top:1px solid var(--rule);padding-bottom:var(--safeB)}
nav button{flex:1;padding:10px 3px 9px;display:flex;flex-direction:column;align-items:center;gap:5px;
color:var(--dim);min-height:var(--tap);position:relative}
nav button.on{color:var(--amber)}
nav button.on::before{content:"";position:absolute;top:0;left:22%;right:22%;height:2px;background:var(--amber)}
nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
nav span{font-family:var(--mono);font-size:9px;letter-spacing:.1em;text-transform:uppercase;font-weight:700}
.dgroup{margin-bottom:20px}
.dhead{display:flex;align-items:center;justify-content:space-between;
padding-bottom:8px;margin-bottom:9px;border-bottom:1px solid var(--rule)}
.dhead h2{margin:0;font-size:17px}
.dhead .w{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.06em}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:7px}
.cell{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);
padding:10px 11px;display:flex;flex-direction:column;gap:6px;position:relative;overflow:hidden}
.cell::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--rule2)}
.cell.part::before{background:var(--amber)}
.cell.solid::before{background:var(--go)}
.cell .tno{font-family:var(--mono);font-size:9px;letter-spacing:.13em;color:var(--dim);font-weight:700}
.cell .tname{font-size:13px;line-height:1.32;font-weight:600}
.meter{height:3px;background:var(--panel2);border-radius:2px;overflow:hidden;margin-top:auto}
.meter i{display:block;height:100%;background:var(--go);transition:width .5s ease}
.cause{display:flex;gap:7px;margin-top:10px}
.cause .btn{flex:1;font-size:12px;letter-spacing:.05em;padding:11px 5px;min-height:56px;line-height:1.25}
.miss{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:13px 15px;margin-bottom:8px}
.miss .q{font-size:14.5px;line-height:1.42;margin:8px 0 8px}
.pill{display:inline-block;font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;
padding:4px 7px;border-radius:3px;font-weight:700;border:1px solid transparent}
.pill.company{background:color-mix(in srgb,var(--stop) 16%,transparent);color:var(--stop);border-color:color-mix(in srgb,var(--stop) 40%,transparent)}
.pill.misread{background:color-mix(in srgb,var(--amber) 16%,transparent);color:var(--amber);border-color:color-mix(in srgb,var(--amber) 40%,transparent)}
.pill.unknown{background:var(--panel2);color:var(--muted);border-color:var(--rule)}
.empty{text-align:center;padding:46px 20px;color:var(--muted)}
.empty p{font-size:15px;line-height:1.55;margin:0 0 18px}
.rule{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:15px;margin-bottom:8px}
.rule h3{font-family:var(--display);font-size:18px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;margin:5px 0 8px}
.rule p{margin:0;font-size:15px;line-height:1.5}
.rule .look{margin-top:11px;padding-top:11px;border-top:1px solid var(--rule);font-size:13.5px;color:var(--muted);line-height:1.5}
.rule .look b{color:var(--go);font-weight:700}
.rule .look i{color:var(--stop);font-style:normal;font-weight:700}
label.field{display:block;margin-bottom:14px}
label.field span{display:block;margin-bottom:7px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;
text-transform:uppercase;color:var(--dim);font-weight:700}
input[type=date],input[type=file]{width:100%;background:var(--panel);border:1px solid var(--rule);color:var(--chalk);
border-radius:var(--r);padding:13px 14px;font-family:var(--sans);font-size:16px;min-height:var(--tap)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 0;border-bottom:1px solid var(--rule)}
.toggle:last-of-type{border-bottom:none}
.toggle .lbl{font-size:15.5px;font-weight:650}
.toggle .desc{font-size:13px;color:var(--muted);line-height:1.42;margin-top:3px}
.sw{flex:none;width:50px;height:30px;border-radius:4px;background:var(--panel2);border:1px solid var(--rule2);position:relative;transition:background .16s}
.sw i{position:absolute;top:2px;left:2px;width:24px;height:24px;border-radius:3px;background:var(--muted);transition:transform .16s,background .16s}
.sw.on{background:var(--amber);border-color:var(--amber)}
.sw.on i{transform:translateX(20px);background:#191307}
.score{display:flex;align-items:baseline;gap:6px;margin:2px 0 4px}
.score b{font-family:var(--display);font-size:64px;font-weight:700;line-height:.9;letter-spacing:.01em}
.score span{font-family:var(--mono);font-size:22px;color:var(--muted);font-weight:600}
.calib{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--rule);
border:1px solid var(--rule);border-radius:var(--r);overflow:hidden;margin-top:10px}
.calib div{background:var(--panel);padding:13px 8px;text-align:center}
.calib b{display:block;font-family:var(--display);font-size:26px;font-weight:700;line-height:1}
.calib span{display:block;font-size:10.5px;color:var(--muted);margin-top:6px;line-height:1.3}
.tag.logic{color:var(--go);border-color:color-mix(in srgb,var(--go) 45%,var(--rule));background:color-mix(in srgb,var(--go) 10%,transparent)}
.tag.mr{color:var(--chalk);border-color:var(--rule2);background:var(--panel2)}
.casebox{border:1px solid var(--rule);border-radius:var(--r);background:var(--panel);margin-bottom:14px;overflow:hidden}
.casehead{display:flex;align-items:center;justify-content:space-between;width:100%;
padding:11px 13px;background:var(--panel2);border-bottom:1px solid var(--rule);min-height:46px}
.casehead .chev{font-family:var(--mono);font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--amber);font-weight:700}
.casebody{padding:13px 14px 4px}
.casebody p{margin:0 0 11px;font-size:15px;line-height:1.5;color:var(--chalk)}
.gfxwrap{background:var(--panel);border:1px solid var(--rule);border-radius:var(--r);padding:12px 10px;margin-bottom:16px}
svg.gfx{width:100%;height:auto;display:block;overflow:visible}
svg.gfx .ax{stroke:var(--rule2);stroke-width:1}
svg.gfx .lab{font-family:var(--mono);font-size:8px;fill:var(--muted);letter-spacing:.06em}
svg.gfx .lab.lg{fill:var(--dim)}
svg.gfx .rw{font-size:8.5px;fill:var(--chalk)}
svg.gfx .ideal{fill:none;stroke:var(--rule2);stroke-width:1.6;stroke-dasharray:4 3}
svg.gfx .actual{fill:none;stroke:var(--amber);stroke-width:2.2}
svg.gfx .dot{fill:var(--amber)}
svg.gfx .pv{fill:none;stroke:var(--muted);stroke-width:1.8;stroke-dasharray:4 3}
svg.gfx .ev{fill:none;stroke:var(--go);stroke-width:2.2}
svg.gfx .ac{fill:none;stroke:var(--stop);stroke-width:2.2}
svg.gfx .cellbox{fill:var(--panel2);stroke:var(--rule);stroke-width:.8}
svg.gfx .raci{font-family:var(--mono);font-size:10px;font-weight:700}
svg.gfx .r-A{fill:var(--amber)} svg.gfx .r-R{fill:var(--go)}
svg.gfx .r-C{fill:var(--muted)} svg.gfx .r-I{fill:var(--dim)}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;
background:var(--panel);border:1px solid var(--rule2);border-radius:var(--r);padding:13px 14px;min-height:var(--tap)}
.modebtn:active{background:var(--panel2)}
.modebtn b{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.07em;text-transform:uppercase}
.modebtn span{font-size:12px;color:var(--muted);line-height:1.3}
html[data-fs="lg"] .scenario,html[data-fs="lg"] .casebody p{font-size:20px;line-height:1.55}
html[data-fs="lg"] .ask{font-size:20px}
html[data-fs="lg"] .opt .txt{font-size:17.5px}
html[data-fs="lg"] .why,html[data-fs="lg"] .rulebox p{font-size:16.5px}
html[data-fs="xl"] .scenario,html[data-fs="xl"] .casebody p{font-size:22px;line-height:1.6}
html[data-fs="xl"] .ask{font-size:22px}
html[data-fs="xl"] .opt .txt{font-size:19px}
html[data-fs="xl"] .why,html[data-fs="xl"] .rulebox p{font-size:18px}
.pacev{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;font-weight:700;color:var(--dim)}
.pacev.warn{color:var(--amber)} .pacev.over{color:var(--stop)}
.gfxcap{margin:9px 2px 0;font-size:13px;line-height:1.45;color:var(--muted)}
.cell{text-align:left;width:100%}
.cell:active{background:var(--panel2)}
.fadein{animation:fi .22s ease both}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (max-height:720px){
h1{font-size:27px}
.bar{padding-top:calc(var(--safeT) + 9px);padding-bottom:9px}
.plan{padding-top:9px}
.plan-meta{padding:6px 0 9px}
.qwrap{padding-top:12px}
.qtags{margin-bottom:10px}
.scenario{font-size:16.5px;line-height:1.44;margin-bottom:12px}
.ask{font-size:17px;margin-bottom:12px}
.opt .txt{font-size:14.5px;padding:11px 12px}
.dock{padding-top:9px;gap:6px}
.stat b{font-size:25px}
}
@media (min-width:700px){
body{background:var(--surround)}
#app{max-width:560px;margin:0 auto;background:var(--ground);
border-left:1px solid var(--rule);border-right:1px solid var(--rule)}
.scenario,.opt .txt{font-size:16.5px}
}
@media (min-width:700px) and (min-height:940px){
#app{height:min(100dvh,960px);margin:calc((100dvh - min(100dvh,960px))/2) auto;
border:1px solid var(--rule);border-radius:12px;overflow:hidden}
}</style>
</head>

<div id="app"></div>
<script src="d0.js"></script>
<script src="d1.js"></script>
<script src="d2.js"></script>
<script src="d3.js"></script>
<script src="d4.js"></script>
<script src="d5.js"></script>
<script src="d6.js"></script>
<script src="d7.js"></script>
<script src="d8.js"></script>
<script src="d9.js"></script>
<script src="d10.js"></script>
<script src="d11.js"></script>
<script src="e1.js"></script>
